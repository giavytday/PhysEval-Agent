[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physeval-agent"
version = "0.1.0"
description = "PhysEval-Agent: deterministic scientific execution and verification framework for climate and power-systems modeling."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PhysEval-Agent Contributors" }]
keywords = [
    "benchmark",
    "llm-agents",
    "power-systems",
    "climate-modeling",
    "verification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
grid = ["pypsa>=0.28", "h5py>=3.8", "netCDF4>=1.6"]
climate = ["xarray>=2023.11", "netCDF4>=1.6", "scipy>=1.10"]
llm = ["openai>=1.30"]
all = ["pypsa>=0.28", "xarray>=2023.11", "netCDF4>=1.6", "h5py>=3.8", "openai>=1.30"]
train = [
    "torch>=2.1",
    "transformers>=4.44",
    "datasets>=2.20",
    "accelerate>=0.31",
    "peft>=0.11",
    "trl>=0.9",
    "bitsandbytes>=0.43; platform_machine == 'x86_64'",
    "wandb",
]
hub = ["huggingface_hub>=0.24", "datasets>=2.20"]
report = ["matplotlib>=3.8"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.21", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
physeval-rollouts = "physeval.run_rollouts:main"

[tool.setuptools.packages.find]
include = ["physeval*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    # Py3.9 support: PEP 604 unions / typing.List retained for Pydantic.
    "UP006",
    "UP007",
    "UP035",
    "UP045",
]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pypsa.*", "xarray.*", "openai.*", "netCDF4.*", "h5py.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Our own code must stay warning-free; the ignores below are scoped to
    # known third-party library noise (matched by originating module).
    "error",
    # pypsa -> matplotlib -> pyparsing deprecations fire during oracle
    # verification when PyPSA networks are deserialized in-process.
    "ignore::Warning:pyparsing",
    "ignore::Warning:matplotlib",
    # numpy ABI shim warning raised by importlib bootstrap, not our code.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
